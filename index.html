<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>游戏本 · Games</title>
<meta name="description" content="画在作业本上的小游戏合集。">
<meta name="theme-color" content="#f6f3e6">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='4' fill='%23f6f3e6'/><circle cx='16' cy='16' r='8' fill='none' stroke='%231a30c0' stroke-width='2'/><path d='M16 4v6M16 22v6M4 16h6M22 16h6' stroke='%231a30c0' stroke-width='2'/><circle cx='16' cy='16' r='2' fill='%23d02030'/></svg>">
<style>
:root {
  --ink: #1a30c0;
  --ink-soft: rgba(26, 48, 192, .16);
  --red: #d02030;
  --paper: #f6f3e6;
  --card: rgba(252, 250, 241, .93);
  --font: 'Comic Sans MS', 'Marker Felt', 'Segoe Print', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  color: var(--ink);
  font-family: var(--font);
  background-color: var(--paper);
  background-image:
    linear-gradient(90deg, rgba(208, 32, 48, .22) 0 1.5px, transparent 1.5px),
    repeating-linear-gradient(0deg, transparent 0 31px, rgba(26, 48, 192, .11) 31px 32.5px);
  background-position: 92px 0, 0 0;
  background-repeat: no-repeat, repeat;
  -webkit-font-smoothing: antialiased;
}

.wrap {
  max-width: 1100px;
  margin: 0 auto;
  padding: 60px 28px 48px;
}

header {
  margin-bottom: 44px;
  animation: settle .5s ease-out both;
}

.kicker {
  font-size: 15px;
  letter-spacing: 3px;
  opacity: .65;
  margin-bottom: 6px;
}

h1 {
  margin: 0;
  font-size: clamp(46px, 8vw, 86px);
  line-height: 1.05;
  letter-spacing: 3px;
  font-weight: normal;
  transform: rotate(-1.6deg);
  transform-origin: left center;
  text-decoration: underline wavy rgba(26, 48, 192, .45);
  text-decoration-thickness: 3px;
  text-underline-offset: 12px;
}

.sub {
  margin: 18px 0 0;
  font-size: 18px;
  opacity: .78;
  transform: rotate(.4deg);
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 30px;
}

.card {
  display: flex;
  flex-direction: column;
  color: var(--ink);
  text-decoration: none;
  background: var(--card);
  border: 3px solid var(--ink);
  border-radius: 14px 20px 12px 18px / 18px 12px 20px 14px;
  box-shadow: 7px 8px 0 var(--ink-soft);
  overflow: hidden;
  transform: rotate(var(--tilt, -.5deg));
  transition: transform .22s ease, box-shadow .22s ease;
  animation: settle .55s ease-out both;
}

.grid > .card:nth-child(3n+2) { --tilt: .55deg; }
.grid > .card:nth-child(3n) { --tilt: -.15deg; }

.card:not(.ghost):hover,
.card:not(.ghost):focus-visible {
  transform: rotate(0deg) translateY(-7px);
  box-shadow: 12px 16px 0 rgba(26, 48, 192, .18);
  outline: none;
}

.card:not(.ghost):focus-visible {
  outline: 3px dashed var(--red);
  outline-offset: 4px;
}

.thumb {
  position: relative;
  aspect-ratio: 16 / 9;
  background: #fbf9ef;
  border-bottom: 2px dashed rgba(26, 48, 192, .4);
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

.thumb svg { width: 100%; height: 100%; display: block; }

.body { padding: 18px 22px 22px; }

.name {
  display: flex;
  align-items: baseline;
  gap: 10px;
  flex-wrap: wrap;
}

.name h2 {
  margin: 0;
  font-size: 28px;
  font-weight: normal;
  letter-spacing: 1px;
}

.name span {
  font-size: 13px;
  letter-spacing: 1.5px;
  opacity: .55;
}

.tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: 10px 0 12px;
}

.tag {
  font-size: 12.5px;
  padding: 2px 9px;
  border: 2px solid rgba(26, 48, 192, .55);
  border-radius: 8px 11px 7px 10px / 10px 7px 11px 8px;
  opacity: .8;
}

.desc {
  margin: 0;
  font-size: 15.5px;
  line-height: 1.6;
  opacity: .82;
}

.go {
  margin-top: 16px;
  font-size: 17px;
  color: var(--red);
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.go .arrow { transition: transform .22s ease; }
.card:hover .go .arrow,
.card:focus-visible .go .arrow { transform: translateX(5px); }

.ghost {
  border-style: dashed;
  background: rgba(252, 250, 241, .5);
  box-shadow: none;
  cursor: default;
}

.ghost .thumb {
  border-bottom-color: rgba(26, 48, 192, .22);
  background: transparent;
}

.ghost .body { opacity: .5; }
.ghost .name h2 { font-size: 22px; }

footer {
  margin-top: 46px;
  padding-top: 20px;
  border-top: 2px dashed rgba(26, 48, 192, .35);
  display: flex;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  font-size: 14px;
  opacity: .6;
  animation: settle .6s .2s ease-out both;
}

@keyframes settle {
  from { opacity: 0; transform: translateY(14px) rotate(var(--tilt, 0deg)); }
  to   { opacity: 1; transform: translateY(0) rotate(var(--tilt, 0deg)); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

@media (max-width: 640px) {
  body { background-position: 42px 0, 0 0; }
  .wrap { padding: 40px 18px 36px; }
  .grid { grid-template-columns: 1fr; gap: 24px; }
  header { margin-bottom: 32px; }
}
</style>
</head>
<body>

  <header>
    <div class="kicker">GAMES · 持续更新</div>

  <footer>
    <span id="count"></span>
    <span>更多游戏正在涂鸦中…</span>
  </footer>
